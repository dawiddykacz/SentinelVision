version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vision_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vision_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: vision_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: vision_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Kafka przedstawia się teraz wewnątrz sieci jako "kafka"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Nasza aplikacja w Spring Boot
  backend:
    build: 
      context: ./Backend
    container_name: vision_backend
    ports:
      - "8088:8088" # Lub 8080, zależy jak masz w application.properties
    depends_on:
      - postgres
      - kafka
    volumes:
      - shared_videos:/app/uploads # Współdzielony folder na wideo

  # Nasz skrypt Python z YOLO
  analyzer:
    build:
      context: ./AnomalyModel
    container_name: vision_analyzer
    depends_on:
      - kafka
    volumes:
      - shared_videos:/app/uploads # Ten sam współdzielony folder!

volumes:
  postgres_data:
  shared_videos: # Definicja wspólnego dysku dla Javy i Pythona